name: small_cyclic

graph:
  processes:
    src:
      ports:
        out: [op1, op2]
    mul:
      ports:
        in: [in1, in2]
        out: [product]
      # exec_cycles: 2
    add:
      ports:
        in: [in1, in2]
        out: [sum0, sum1]
    sink:
      ports:
        in: [mac]
  channels:
    ch0:
      src: {process: src, port: op1}
      dst: {process: mul, port: in1}
      token_size: 4
    ch1:
      src: {process: src, port: op2}
      dst: {process: mul, port: in2}
      token_size: 4
    ch2:
      src: {process: mul, port: product}
      dst: {process: add, port: in1}
      token_size: 4
    ch3:
      src: {process: add, port: sum0}
      dst: {process: add, port: in2}
      token_size: 4
    ch4:
      src: {process: add, port: sum1}
      dst: {process: sink, port: mac}
      token_size: 4

execution:
  processes:
    profiles:
      src_sink:
        ARM_CORTEX_A7:
          cycles: 1500000
        ARM_CORTEX_A15:
          cycles: 1000000
        proc_type_0:
          cycles: 1500000
        proc_type_1:
          cycles: 1000000
      mul:
        ARM_CORTEX_A7:
          cycles: 3000000
        ARM_CORTEX_A15:
          cycles: 2000000
        proc_type_0:
          cycles: 3000000
        proc_type_1:
          cycles: 2000000
      add:
        ARM_CORTEX_A7:
          cycles: 1500000
        ARM_CORTEX_A15:
          cycles: 1000000
        proc_type_0:
          cycles: 1500000
        proc_type_1:
          cycles: 1000000

    instances:
      src:
        model: static
        profile: src_sink
        rates:
          op1: 1
          op2: 1
      mul:
        model: static
        profile: mul
        rates:
          in1: 1
          in2: 1
          product: 1
      add:
        model: static
        profile: add
        rates:
          in1: 1
          in2: 1
          sum0: 1
          sum1: 1
      sink:
        model: static
        profile: src_sink
        rates:
          mac: 1

  channels:
    ch0:
      initial_tokens: 0
    ch1:
      initial_tokens: 0
    ch2:
      initial_tokens: 0
    ch3:
      initial_tokens: 1
    ch4:
      initial_tokens: 0
