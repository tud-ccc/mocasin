name: small_acyclic

graph:
  processes:
    src:
      ports:
        out: [output]
    compute:
      ports:
        in: [input]
        out: [output]
    sink:
      ports:
        in: [input]
  channels:
    ch0:
      src: {process: src, port: output}
      dst: {process: compute, port: input}
      token_size: 4
    ch1:
      src: {process: compute, port: output}
      dst: {process: sink, port: input}
      token_size: 4
