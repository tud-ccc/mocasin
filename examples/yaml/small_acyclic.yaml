name: test
nodes:
  - name: src
    ports:
      out: [output]
  - name: compute
    ports:
      in: [input]
      out: [output]
  - name: sink
    ports:
      in: [input]
channels:
  - name: ch0
    src: {node: src, port: output}
    dst: {node: compute, port: input}
    token_size: 4
  - name: ch1
    src: {node: compute, port: output}
    dst: {node: sink, port: input}
    token_size: 4
